<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>SAI - Tarjetas Digitales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a1a2e;
      padding: 16px;
    }
    .container {
      max-width: 440px;
      width: 100%;
      position: relative;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6);
    }
    .container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.3) 70%);
    }
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: #0b1a2e;
      background: #fbbf24;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      transition: all 0.1s ease;
      letter-spacing: 0.5px;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .btn-particular { background: #22c55e; }
    .btn-comercio { background: #8b5cf6; color: #fff; }
    .btn-motorizado { background: #fbbf24; }

    .footer-text {
      color: #a0c4e8;
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- PORTADA GENERADA POR PLAYYYY -->
  <img src="portada-formulario.jpg" alt="SAI - Sistema Generador de Tarjetas Digitales Inteligentes">

  <!-- BOTONES SUPERPUESTOS -->
  <div class="overlay">
    <div class="btn-group">
      <a href="motorizado.html" class="btn btn-motorizado">🏍️ Motorizados</a>
      <a href="particular.html" class="btn btn-particular">👤 Particulares</a>
      <a href="comercio.html" class="btn btn-comercio">🏪 Comercios</a>
    </div>
    <div class="footer-text">🐙 Guía Digital · Cúcuta</div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>SAI - Tarjetas Digitales</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet">
  <style>
    body {
      background: #0a1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 20px;
    }
    .card-container {
      max-width: 480px;
      width: 100%;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 40px 24px;
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      color: white;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center;
      color: #a0c4e8;
      font-size: 16px;
      margin-bottom: 32px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    .btn-custom {
      min-height: 72px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 20px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-transform: none;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    }
    .btn-custom:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .btn-motorizado {
      background: #fbbf24;
      color: #0b1a2e;
      border: none;
    }
    .btn-motorizado:hover {
      background: #f59e0b;
    }
    .btn-particular {
      background: #22c55e;
      color: #0b1a2e;
      border: none;
    }
    .btn-particular:hover {
      background: #16a34a;
    }
    .btn-comercio {
      background: #8b5cf6;
      color: #fff;
      border: none;
    }
    .btn-comercio:hover {
      background: #7c3aed;
    }
    .icon {
      font-size: 28px;
    }
    .footer-note {
      text-align: center;
      color: #6b8fa0;
      font-size: 13px;
      margin-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 20px;
    }
    .footer-note a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <h1>🚀 <span style="color:#fbbf24;">SAI</span> Digital</h1>
    <p class="subtitle">Elige tu perfil y genera tu tarjeta al instante</p>

    <div class="flex flex-col gap-4">
      <a href="motorizado.html" class="btn btn-custom btn-motorizado w-full">
        <span class="icon">🏍️</span> Soy Motorizado
      </a>
      <a href="particular.html" class="btn btn-custom btn-particular w-full">
        <span class="icon">👤</span> Soy Particular
      </a>
      <a href="comercio.html" class="btn btn-custom btn-comercio w-full">
        <span class="icon">🏪</span> Tengo un Comercio
      </a>
    </div>

    <div class="footer-note">
      <span>🐙 </span> <a href="https://guia-digital.com" target="_blank">Guía Digital</a> · Tarjetas que generan ingresos
    </div>
  </div>
</body>
</html>

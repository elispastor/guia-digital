<!DOCTYPE html>
<html>
<head>
  <title>MAP - Mi Agente Personal</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #0b2b40; text-align: center; }
    #chat { border: 1px solid #ddd; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; }
    #input { width: 80%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
    #send { padding: 12px 20px; background: #0b2b40; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .user { background: #e1f5fe; padding: 8px; margin: 5px 0; border-radius: 10px; }
    .bot { background: #f0f0f0; padding: 8px; margin: 5px 0; border-radius: 10px; }
    .input-area { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <h1>🧠 MAP - Mi Agente Personal</h1>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje...">
    <button id="send">Enviar</button>
  </div>

  <script>
    function responder(mensaje) {
      const msg = mensaje.toLowerCase().trim();

      // Saludos y presentación
      if (msg.includes('hola') || msg.includes('buenas')) {
        return "¡Hola! Soy MAP, tu agente personal. Estoy aquí para ayudarte con la Guía Digital y el SAI.";
      }

      // Preguntas sobre el SAI
      if (msg.includes('sai') || msg.includes('automatización') || msg.includes('registro')) {
        return "El SAI (Sistema de Automatización de Ingresos) es el corazón de la Guía Digital. Con él puedes gestionar registros, automatizar procesos y conectar con clientes. ¿Qué necesitas saber específicamente?";
      }

      // Preguntas sobre la Guía Digital
      if (msg.includes('guía') || msg.includes('directorio') || msg.includes('negocios')) {
        return "La Guía Digital de Cúcuta es un directorio de negocios, talleres y servicios. Cada negocio tiene su propia tarjeta digital con WhatsApp, ubicación y más. ¿Te gustaría saber cómo incluir tu negocio?";
      }

      // Preguntas sobre el usuario
      if (msg.includes('quien eres') || msg.includes('quién eres')) {
        return "Soy MAP, tu agente personal. Mi misión es ayudarte a gestionar la Guía Digital y el SAI. Dime qué necesitas y te guiaré.";
      }

      // Si no reconoce el mensaje
      return "Entiendo tu mensaje. ¿Puedes ser más específico? Estoy aquí para ayudarte con la Guía Digital o el SAI.";
    }

    // Lógica del chat
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      setTimeout(() => {
        const response = responder(message);
        addMessage(response, 'bot');
      }, 500);
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    addMessage('👋 ¡Hola! Soy MAP, tu agente personal. Estoy aquí para ayudarte con la Guía Digital y el SAI.', 'bot');
  </script>
</body>
</html>

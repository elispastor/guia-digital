<!DOCTYPE html>
<html>
<head>
  <title>MAP - Mi Agente Personal</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #0b2b40; text-align: center; }
    #chat { border: 1px solid #ddd; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; }
    #input { width: 80%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
    #send { padding: 12px 20px; background: #0b2b40; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .user { background: #e1f5fe; padding: 8px; margin: 5px 0; border-radius: 10px; }
    .bot { background: #f0f0f0; padding: 8px; margin: 5px 0; border-radius: 10px; }
    .input-area { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <h1>🧠 MAP - Mi Agente Personal</h1>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje...">
    <button id="send">Enviar</button>
  </div>

  <script>
    // Este es el "cerebro" simple del agente
    function responder(mensaje) {
      const respuestas = {
        'hola': '¡Hola! Soy MAP, tu agente personal. ¿En qué puedo ayudarte?',
        'como estas': 'Estoy aquí, listo para ayudarte. ¿Qué necesitas?',
        'quien eres': 'Soy MAP, un agente personal creado para ayudarte en tus tareas.',
        'que haces': 'Te ayudo a encontrar información, responder preguntas y gestionar tareas.',
        'ayuda': 'Puedes preguntarme sobre productos de limpieza NABIN, el SAI, o lo que necesites.'
      };
      
      const msg = mensaje.toLowerCase().trim();
      for (const [clave, valor] of Object.entries(respuestas)) {
        if (msg.includes(clave)) return valor;
      }
      return "Entiendo tu mensaje. ¿Puedes ser más específico? Estoy aquí para ayudarte.";
    }

    // Lógica del chat
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      
      // Simula el tiempo de respuesta del agente
      setTimeout(() => {
        const response = responder(message);
        addMessage(response, 'bot');
      }, 500);
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Mensaje de bienvenida
    addMessage('👋 ¡Hola! Soy MAP, tu agente personal. ¿En qué puedo ayudarte?', 'bot');
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>MAP - Agente IA con Cloudflare</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Estilos mejorados para móvil */
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 16px; background: #f5f5f5; }
    h1 { color: #0b2b40; text-align: center; font-size: 24px; }
    #chat { border: 1px solid #ddd; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; font-size: 16px; }
    #input { width: 75%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    #send { padding: 12px 16px; background: #0b2b40; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    .user { background: #e1f5fe; padding: 10px; margin: 6px 0; border-radius: 10px; }
    .bot { background: #f0f0f0; padding: 10px; margin: 6px 0; border-radius: 10px; }
    .input-area { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-area input { flex: 1; min-width: 200px; }
    
    /* Estilos para el formulario (responsivo) */
    #formulario-sai { background: white; padding: 16px; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
    #formulario-sai h2 { font-size: 20px; margin-top: 0; }
    #formulario-sai input, #formulario-sai button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    #formulario-sai button { background: #0b2b40; color: white; border: none; cursor: pointer; }
    #formulario-sai button:hover { background: #1a4a60; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <h1>🧠 MAP con IA</h1>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje...">
    <button id="send">Enviar</button>
  </div>

  <!-- Formulario SAI (responsivo) -->
  <div id="formulario-sai">
    <h2>📋 Registro SAI</h2>
    <form id="form-sai">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="text" id="telefono" placeholder="Teléfono / WhatsApp" required>
      <input type="email" id="email" placeholder="Correo electrónico">
      <button type="submit">Registrarse en el SAI</button>
    </form>
    <div id="respuesta-form" class="oculto" style="margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 5px;"></div>
  </div>

  <script>
    // Configuración de Cloudflare AI
    const CF_ACCOUNT_ID = 'tu-account-id';    // Reemplaza con tu Account ID
    const CF_API_TOKEN = 'tu-token-aqui';      // Reemplaza con tu token

    // Lógica del chat con IA
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function consultarIA(mensaje) {
      try {
        const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/run/@cf/meta/llama-3-8b-instruct`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${CF_API_TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Eres MAP, un asistente personal experto en automatización con Node-RED y la Guía Digital.' },
              { role: 'user', content: mensaje }
            ]
          })
        });
        const data = await response.json();
        return data.result.response || 'Lo siento, no pude procesar tu mensaje.';
      } catch (error) {
        console.error('Error al consultar IA:', error);
        return 'Hubo un error al conectar con la IA. Inténtalo de nuevo.';
      }
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      const respuesta = await consultarIA(message);
      addMessage(respuesta, 'bot');
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Manejo del formulario SAI (envío a Node-RED)
    document.getElementById('form-sai').addEventListener('submit', async function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const email = document.getElementById('email').value;

      // Mostrar mensaje de carga
      const respuestaDiv = document.getElementById('respuesta-form');
      respuestaDiv.className = '';
      respuestaDiv.textContent = '⏳ Enviando datos al SAI...';
      respuestaDiv.style.background = '#fff3e0';

      try {
        // Enviar datos a Node-RED (endpoint que usted creará)
        const response = await fetch('https://tu-servidor-node-red.com/api/sai/registro', { // CAMBIAR POR SU URL
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, telefono, email })
        });
        const data = await response.json();
        respuestaDiv.textContent = `✅ Registro exitoso. ¡Bienvenido al SAI, ${nombre}!`;
        respuestaDiv.style.background = '#e8f5e9';
        // Opcional: limpiar el formulario
        document.getElementById('form-sai').reset();
      } catch (error) {
        respuestaDiv.textContent = '❌ Error al registrar. Inténtalo de nuevo.';
        respuestaDiv.style.background = '#ffebee';
        console.error('Error al enviar a Node-RED:', error);
      }
    });

    // Mensaje de bienvenida
    addMessage('👋 ¡Hola! Soy MAP, tu agente con IA. Pregúntame sobre el SAI, la Guía Digital o automatización.', 'bot');
  </script>
</body>
</html>

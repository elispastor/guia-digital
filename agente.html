<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAP - Agente SAI</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 16px; background: #f5f5f5; }
    h1 { color: #0b2b40; text-align: center; font-size: 24px; }
    #chat { border: 1px solid #ddd; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; font-size: 16px; }
    #input { width: 75%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    #send { padding: 12px 16px; background: #0b2b40; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    .user { background: #e1f5fe; padding: 10px; margin: 6px 0; border-radius: 10px; }
    .bot { background: #f0f0f0; padding: 10px; margin: 6px 0; border-radius: 10px; }
    .input-area { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-area input { flex: 1; min-width: 200px; }
    
    #formulario-sai { background: white; padding: 16px; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
    #formulario-sai h2 { font-size: 20px; margin-top: 0; }
    #formulario-sai input, #formulario-sai button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    #formulario-sai button { background: #0b2b40; color: white; border: none; cursor: pointer; }
    #formulario-sai button:hover { background: #1a4a60; }
    #mensaje { margin-top: 12px; font-weight: bold; }

    #tarjeta-container { display: none; margin-top: 20px; padding: 16px; background: #e8f5e9; border-radius: 10px; border: 1px solid #4caf50; }
    #tarjeta-container h3 { margin-top: 0; }
    .qr img { max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 8px; padding: 8px; background: white; }
    .botones-tarjeta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .btn-tarjeta { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; display: inline-block; }
    .btn-compartir { background: #0b2b40; }
    .btn-llamar { background: #2a7a6a; }
    .btn-whatsapp { background: #25d366; }
  </style>
</head>
<body>
  <h1>🧠 MAP con IA</h1>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje...">
    <button id="send">Enviar</button>
  </div>

  <div id="formulario-sai">
    <h2>📋 Registro SAI</h2>
    <form id="formularioRegistro">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" required>
      <input type="email" id="email" placeholder="Correo electrónico">
      <button type="submit">Registrarse en el SAI</button>
    </form>
    <div id="mensaje"></div>
    <div id="tarjeta-container">
      <h3>🧾 Tu tarjeta SAI</h3>
      <div id="tarjeta-contenido"></div>
      <div class="botones-tarjeta">
        <a id="btn-compartir" href="#" target="_blank" class="btn-tarjeta btn-compartir">🔗 Compartir</a>
        <a id="btn-llamar" href="#" class="btn-tarjeta btn-llamar">📞 Llamar</a>
        <a id="btn-whatsapp" href="#" target="_blank" class="btn-tarjeta btn-whatsapp">💬 WhatsApp</a>
      </div>
      <p><a id="enlace-tarjeta" href="#" target="_blank">Ver tarjeta completa</a></p>
    </div>
  </div>

  <script>
    // === CHAT DE MAP ===
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // === FUNCIÓN DE RESPALDO ===
    function responder(mensaje) {
      const msg = mensaje.toLowerCase().trim();
      if (msg.includes('hola') || msg.includes('buenas')) {
        return "¡Hola! Soy MAP, tu agente personal. Estoy aquí para ayudarte con el SAI y la Guía Digital.";
      }
      if (msg.includes('sai') || msg.includes('registro') || msg.includes('automatización')) {
        return "El SAI es el Sistema de Automatización de Ingresos. Puedes registrarte usando el formulario de abajo. ¿Necesitas ayuda con algo más?";
      }
      if (msg.includes('guía') || msg.includes('directorio')) {
        return "La Guía Digital de Cúcuta es un directorio de negocios, talleres y servicios. ¿Te gustaría saber cómo incluir tu negocio?";
      }
      if (msg.includes('quien eres') || msg.includes('quién eres')) {
        return "Soy MAP, tu agente personal. Mi misión es ayudarte a gestionar la Guía Digital y el SAI.";
      }
      return "Entiendo tu mensaje. ¿Puedes ser más específico? Estoy aquí para ayudarte con la Guía Digital o el SAI.";
    }

    // === IA CON CLOUDFLARE ===
    async function consultarIA(mensaje) {
      try {
        const response = await fetch('https://api.cloudflare.com/client/v4/accounts/4b18410b83bdabcf59fc4e4249166ba8/ai/run/@cf/meta/llama-3-8b-instruct', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Eres MAP, un asistente personal experto en automatización.' },
              { role: 'user', content: mensaje }
            ]
          })
        });
        const data = await response.json();
        return data.result.response;
      } catch (error) {
        console.warn('IA falló, usando respaldo:', error);
        return null;
      }
    }

    // === FUNCIÓN PARA GENERAR TARJETA ===
    async function generarTarjeta(datos) {
      try {
        const response = await fetch('/api/generar-tarjeta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        return await response.json();
      } catch (error) {
        console.error('Error al generar tarjeta:', error);
        return null;
      }
    }

    // === MOSTRAR TARJETA ===
    function mostrarTarjeta(data) {
      const tarjetaContainer = document.getElementById('tarjeta-container');
      const tarjetaContenido = document.getElementById('tarjeta-contenido');
      const btnCompartir = document.getElementById('btn-compartir');
      const btnLlamar = document.getElementById('btn-llamar');
      const btnWhatsapp = document.getElementById('btn-whatsapp');
      const enlaceTarjeta = document.getElementById('enlace-tarjeta');

      tarjetaContenido.innerHTML = `
        <p><strong>👤 ${data.tarjeta.nombre}</strong></p>
        <p>📱 ${data.tarjeta.telefono}</p>
        <p>📧 ${data.tarjeta.email}</p>
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.enlace)}" alt="QR">
        </div>
      `;

      btnCompartir.href = data.enlace;
      btnLlamar.href = `tel:${data.tarjeta.telefono}`;
      btnWhatsapp.href = `https://wa.me/${data.tarjeta.telefono}`;
      enlaceTarjeta.href = data.enlace;
      enlaceTarjeta.textContent = data.enlace;

      tarjetaContainer.style.display = 'block';
    }

    // === ENVÍO DE MENSAJE (con respaldo IA) ===
    sendMessage = async function() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';

      const respuestaIA = await consultarIA(message);
      if (respuestaIA) {
        addMessage(respuestaIA, 'bot');
      } else {
        addMessage(responder(message), 'bot');
      }
    };

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    addMessage('👋 ¡Hola! Soy MAP, tu agente personal. Estoy aquí para ayudarte con el SAI y la Guía Digital.', 'bot');

    // === FORMULARIO SAI (con generación de tarjeta) ===
    document.getElementById('formularioRegistro').addEventListener('submit', async function (event) {
      event.preventDefault();

      const mensaje = document.getElementById('mensaje');
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const email = document.getElementById('email').value.trim();

      mensaje.textContent = 'Enviando...';
      mensaje.style.color = 'black';

      try {
        // 1. Registrar en el SAI
        const respuesta = await fetch('/api/sai/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, telefono, email })
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(resultado.error || 'El servidor rechazó el registro');
        }

        mensaje.textContent = resultado.mensaje;
        mensaje.style.color = 'green';

        // 2. Generar tarjeta
        const tarjetaData = await generarTarjeta({ nombre, telefono, email });
        if (tarjetaData) {
          mostrarTarjeta(tarjetaData);
        } else {
          mensaje.textContent = '⚠️ Registro exitoso, pero no se pudo generar la tarjeta.';
          mensaje.style.color = 'orange';
        }

        this.reset();

      } catch (error) {
        console.error('Error al registrar:', error);
        mensaje.textContent = '❌ Error al registrar: ' + error.message;
        mensaje.style.color = 'red';
      }
    });
  </script>
</body>
</html>

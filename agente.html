<!DOCTYPE html>
<html>
<head>
  <title>MAP + Formulario NABIN</title>
</head>
<body>
  <h1>🧠 MAP - Mi Agente Personal</h1>
  <div id="chat">
    <!-- Historial del chat -->
  </div>
  <div id="formulario">
    <h2>📋 Solicita tu tarjeta NABIN</h2>
    <form id="form-nabin">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="text" id="telefono" placeholder="Teléfono / WhatsApp" required>
      <input type="text" id="email" placeholder="Correo electrónico">
      <button type="submit">Enviar solicitud</button>
    </form>
  </div>
  <!-- Área para mostrar la tarjeta generada -->
  <div id="tarjeta-generada" style="display:none;">
    <p>✅ Tarjeta generada con éxito. Escanea el QR:</p>
    <img id="qr-imagen" src="" alt="Código QR">
    <p>📲 <span id="datos-tarjeta"></span></p>
  </div>
  <script>
    // Lógica del chat (la que ya tiene)
    // Lógica del formulario
    document.getElementById('form-nabin').addEventListener('submit', function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const email = document.getElementById('email').value;
      
      // Generar la respuesta con los datos
      const mensaje = `✅ Tarjeta NABIN generada para ${nombre}. Teléfono: ${telefono}. Correo: ${email}.`;
      addMessage(mensaje, 'bot');
      
      // Mostrar la tarjeta (simulación)
      document.getElementById('qr-imagen').src = 'https://api.qrserver.com/v1/create-qr-code/?data=Hola ' + encodeURIComponent(nombre);
      document.getElementById('datos-tarjeta').textContent = `${nombre} - ${telefono}`;
      document.getElementById('tarjeta-generada').style.display = 'block';
    });
  </script>
</body>
</html>
